name: CI

# Проверки на каждый push в main и на каждый pull request.
# Матрица: Windows + Ubuntu × Python 3.11 / 3.13 — продукт обязан собираться
# и проходить тесты не только на машине автора.
# Секретов не требуется: всё локально, ни одного сетевого вызова из тестов.

on:
  push:
    branches: [main]
    tags-ignore: ['v*']   # теги собирает release.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    defaults:
      run:
        shell: bash
    env:
      # тесты читают этот флаг: то, что требует живой Hermes Desktop, GPU,
      # сеть или Windows-плагин, само себя пропускает (см. tests/ci_marks.py)
      TEAMROOM_CI: '1'
      # CLI hermes на раннере нет; его песочные глаголы подменяет
      # tools/ci_hermes_shim.py (tests/ci_marks.py по этому флагу видит подмену
      # и честно пропускает то, что требует настоящего Hermes)
      TEAMROOM_CI_HERMES_SHIM: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Клиент hermes для проверок (shim)
        run: |
          bin_dir="$PWD/.ci-bin"
          mkdir -p "$bin_dir"
          cp tools/ci_hermes_shim.py "$bin_dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp tools/ci_hermes_shim.cmd "$bin_dir/hermes.cmd"
          else
            cp tools/ci_hermes_shim.sh "$bin_dir/hermes"
            chmod +x "$bin_dir/hermes"
          fi
          # GITHUB_PATH ждёт родной путь: в git-bash путь MSYS, в Linux — как есть
          if command -v cygpath >/dev/null 2>&1; then
            echo "$(cygpath -w "$bin_dir")" >> "$GITHUB_PATH"
            echo "TEAMROOM_CI_SHIM=$(cygpath -w "$bin_dir")\\ci_hermes_shim.py" >> "$GITHUB_ENV"
          else
            echo "$bin_dir" >> "$GITHUB_PATH"
            echo "TEAMROOM_CI_SHIM=$bin_dir/ci_hermes_shim.py" >> "$GITHUB_ENV"
          fi

      - name: Подмена hermes на месте
        run: |
          hermes --version
          python -c "import shutil, sys; p = shutil.which('hermes'); print('hermes →', p); sys.exit(0 if p else 1)"
          python -c "import shutil, subprocess; p = shutil.which('hermes'); out = subprocess.run([p, '--version'], capture_output=True, text=True).stdout; print(out.strip()); raise SystemExit(0 if 'team-room-ci-hermes-shim' in out else 1)"

      - name: Окружение
        run: |
          python -c "import sys; print(sys.version)"
          node --version
          python -c "print(open('VERSION', encoding='utf-8').read().strip())"

      - name: Python-тесты
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Node-тесты
        run: node --test tests/

      - name: Контракт API
        run: python tools/check_conformance.py

      - name: Фикстуры
        run: python tools/check_fixtures.py

      - name: Сборка релиза
        run: python tools/build_release.py --no-git

      - name: Скан релиза (секреты и личные данные)
        run: |
          pkg="$(python tools/build_release.py --print-package)"
          echo "релиз: $pkg"
          python tools/release_scan.py "$pkg"

      - name: Архивы собраны
        if: runner.os == 'Linux'
        run: |
          pkg="$(python tools/build_release.py --print-package)"
          ls -l "$(dirname "$pkg")"/team-room*.zip "$(dirname "$pkg")"/team-room*.tar.gz
