name: Release

# Публикация релиза: push тега v<version> (например v1.0.0).
# Собирает team-room-<version>.zip и .tar.gz, проверяет версию и тег,
# загружает файлы в GitHub Release — установщики качают их по адресу
# .../releases/latest/download/team-room-<version>.zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Собрать архивы, но не публиковать Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Сборка архивов
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TEAMROOM_CI: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Клиент hermes для проверок (shim)
        # на раннере нет Hermes CLI, а тесты в собранной копии (--run-tests)
        # создают доску песочницы через `hermes kanban boards create`
        run: |
          bin_dir="$PWD/.ci-bin"
          mkdir -p "$bin_dir"
          cp tools/ci_hermes_shim.py "$bin_dir/"
          cp tools/ci_hermes_shim.sh "$bin_dir/hermes"
          chmod +x "$bin_dir/hermes"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "TEAMROOM_CI_SHIM=$bin_dir/ci_hermes_shim.py" >> "$GITHUB_ENV"
          hermes --version

      - name: Версия из VERSION и сверка с тегом
        id: version
        run: |
          version="$(python -c "print(open('VERSION', encoding='utf-8').read().strip())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Версия: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::тег ${GITHUB_REF_NAME} не совпадает с VERSION=$version"
            exit 1
          fi

      - name: Тесты, сборка и архивы
        # Публичный репозиторий уже чист: собираем ровно из чекаута, таблицу
        # обезличивания не применяем (--no-sanitize) и в архив её не кладём.
        run: python tools/build_release.py --no-git --no-sanitize --run-tests --out-dir dist

      - name: Скан релиза
        run: |
          pkg="$(python tools/build_release.py --print-package)"
          python tools/release_scan.py "$pkg"

      - name: Архивы на месте
        run: |
          for name in team-room.zip team-room.tar.gz; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::нет файла dist/$name — установщики качают именно его"
              ls -l dist
              exit 1
            fi
          done
          ls -l dist

      - name: Контрольные суммы
        run: |
          cd dist
          sha256sum team-room*.zip team-room*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: team-room-${{ steps.version.outputs.version }}
          path: |
            dist/team-room*.zip
            dist/team-room*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Публикация Release
    needs: build
    # dry_run по умолчанию true: ручной запуск только собирает архивы
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          name: team-room-${{ needs.build.outputs.version }}
          path: dist

      - name: Показать файлы
        run: ls -l dist

      - name: Загрузить в Release (не падая, если релиз уже есть)
        # Своими руками через gh, а не готовым action: если релиз по тегу уже
        # создан (повторный запуск, ручной workflow_dispatch после релиза),
        # нужно не упасть, а догрузить/перезаписать файлы (--clobber).
        # GH_REPO обязателен: в этом job нет checkout, и без него gh не может
        # определить репозиторий («fatal: not a git repository») — шаг падал.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.build.outputs.version }}"
          title="Комната команды ${{ needs.build.outputs.version }}"
          files="dist/team-room-${{ needs.build.outputs.version }}.zip dist/team-room-${{ needs.build.outputs.version }}.tar.gz dist/team-room.zip dist/team-room.tar.gz dist/SHA256SUMS.txt"
          for f in $files; do
            if [ ! -f "$f" ]; then
              echo "::error::нет файла $f"
              ls -l dist
              exit 1
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже существует — обновляю файлы"
            gh release upload "$tag" $files --clobber
          else
            if gh release create "$tag" --title "$title" --generate-notes $files; then
              echo "Релиз $tag опубликован"
            else
              echo "::warning::создать релиз не удалось — возможно, его создали параллельно; пробую загрузить файлы"
              gh release upload "$tag" $files --clobber
            fi
          fi
          gh release view "$tag" --json tagName,assets --jq '.tagName, (.assets[].name)'
